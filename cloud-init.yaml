
#cloud-config

package_update: true
package_upgrade: false

packages:
  - apache2
  - php
  - libapache2-mod-php
  - php-cli
  - php-mysql
  - php-curl
  - php-gd
  - php-intl
  - php-mbstring
  - php-xml
  - php-zip
  - mariadb-server
  - curl

write_files:
  - path: /usr/local/bin/setup-wordpress.sh
    owner: root:root
    permissions: '0750'
    content: |
      #!/bin/bash
      set -euo pipefail

      # Start Apache and MariaDB
      systemctl enable --now apache2
      systemctl enable --now mariadb

      # Generate separate database and admin passwords
      DB_NAME="wordpress"
      DB_USER="wpuser"
      DB_PASSWORD="$(openssl rand -hex 24)"
      ADMIN_PASSWORD="$(openssl rand -hex 24)"

      # Create the WordPress database and restricted user
      mariadb <<SQL
      CREATE DATABASE wordpress;
      CREATE USER 'wpuser'@'localhost'
        IDENTIFIED BY '${DB_PASSWORD}';
      GRANT ALL PRIVILEGES ON wordpress.*
        TO 'wpuser'@'localhost';
      FLUSH PRIVILEGES;
      SQL

      # Install WP-CLI
      curl -fsSL \
        https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \
        -o /usr/local/bin/wp
      chmod 0755 /usr/local/bin/wp

      # Download WordPress
      mkdir -p /var/www/html
      chown www-data:www-data /var/www/html

      runuser -u www-data -- wp core download \
        --path=/var/www/html

      # Configure WordPress to use MariaDB
      runuser -u www-data -- wp config create \
        --path=/var/www/html \
        --dbname="$DB_NAME" \
        --dbuser="$DB_USER" \
        --dbpass="$DB_PASSWORD" \
        --dbhost=localhost \
        --dbprefix=wp_

      # Obtain the public IPv4 address using IMDSv2
      TOKEN="$(curl -fsS -X PUT \
        -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600' \
        http://169.254.169.254/latest/api/token)"
      PUBLIC_IP="$(curl -fsS \
        -H "X-aws-ec2-metadata-token: $TOKEN" \
        http://169.254.169.254/latest/meta-data/public-ipv4)"
      SITE_URL="http://${PUBLIC_IP}"

      # Complete the WordPress installation
      runuser -u www-data -- wp core install \
        --path=/var/www/html \
        --url="$SITE_URL" \
        --title="My WordPress Website" \
        --admin_user="siteadmin" \
        --admin_password="$ADMIN_PASSWORD" \
        --admin_email="admin@example.com" \
        --skip-email

      # Enable Apache URL rewriting
      a2enmod rewrite

      cat > /etc/apache2/sites-available/wordpress.conf <<'APACHE'
      <VirtualHost *:80>
          DocumentRoot /var/www/html

          <Directory /var/www/html>
              AllowOverride All
              Require all granted
          </Directory>
      </VirtualHost>
      APACHE

      a2ensite wordpress.conf
      a2dissite 000-default.conf

      # Protect the WordPress configuration
      chown -R www-data:www-data /var/www/html
      chown root:www-data /var/www/html/wp-config.php
      chmod 640 /var/www/html/wp-config.php

      # Save generated credentials for the administrator
      umask 077
      {
        printf 'Database name: %s\n' "$DB_NAME"
        printf 'Database user: %s\n' "$DB_USER"
        printf 'Database password: %s\n' "$DB_PASSWORD"
        printf 'WordPress admin user: siteadmin\n'
        printf 'WordPress admin password: %s\n' "$ADMIN_PASSWORD"
        printf 'WordPress URL: %s\n' "$SITE_URL"
      } > /root/wordpress-credentials.txt

      # Validate and restart Apache
      apache2ctl configtest
      systemctl restart apache2

runcmd:
  - [bash, /usr/local/bin/setup-wordpress.sh]
